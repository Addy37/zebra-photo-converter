name: Vendor ZXing scanner
on:
  push:
    branches:
      - beta-vite-architecture
    paths:
      - '.github/workflows/vendor-zxing.yml'
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract pinned upstream distribution
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          npm pack @zxing/browser@0.1.5 --pack-destination "$tmp" --ignore-scripts
          tar -xzf "$tmp/zxing-browser-0.1.5.tgz" -C "$tmp"
          node -e 'const p=require(process.argv[1]); if(p.version!=="0.1.5"||p.name!=="@zxing/browser")process.exit(1); console.log(p.unpkg)' "$tmp/package/package.json"
          mkdir -p app/vendor/zxing
          cp "$tmp/package/umd/zxing-browser.min.js" app/vendor/zxing/zxing-browser.min.js
          cp "$tmp/package/LICENSE" app/vendor/zxing/LICENSE-browser.txt
          npm pack @zxing/library@0.21.3 --pack-destination "$tmp" --ignore-scripts
          mkdir "$tmp/library"
          tar -xzf "$tmp/zxing-library-0.21.3.tgz" -C "$tmp/library"
          cp "$tmp/library/package/LICENSE" app/vendor/zxing/LICENSE-library.txt
          if [ -f "$tmp/package/umd/zxing-browser.min.js.map" ]; then cp "$tmp/package/umd/zxing-browser.min.js.map" app/vendor/zxing/; fi
          if [ -f "$tmp/library/package/NOTICE" ]; then cp "$tmp/library/package/NOTICE" app/vendor/zxing/NOTICE-library.txt; fi
          node --check app/vendor/zxing/zxing-browser.min.js
          sha256sum app/vendor/zxing/zxing-browser.min.js > app/vendor/zxing/SHA256SUMS.txt
          printf '%s\n' 'Unmodified UMD distribution from npm @zxing/browser@0.1.5; browser license and ZXing library notices retained.' > app/vendor/zxing/README.txt
      - name: Commit vendored assets to beta only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/beta-vite-architecture
          git add app/vendor/zxing
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Vendor pinned ZXing browser distribution and license notices"
          git push origin HEAD:refs/heads/beta-vite-architecture
